name: GitLab Sync

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    name: GitHub → GitLab
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          set -e

          git config user.name "Xthrx"
          git config user.email "Xthrx@users.noreply.github.com"

          git remote add gitlab \
            "https://oauth2:${GITLAB_TOKEN}@gitlab.com/chantinlongxthrx/i-steam.git"

          git fetch gitlab main

          # GitLab main is protected, so do NOT force-push.
          # Merge GitLab's existing history while keeping
          # the GitHub version of files when conflicts occur.
          git merge gitlab/main \
            --allow-unrelated-histories \
            -X ours \
            --no-edit

          # Normal push — compatible with a protected branch
          git push gitlab HEAD:main
