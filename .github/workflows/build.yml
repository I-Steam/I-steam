name: Build i-Steam IPA and Release

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      release_channel:
        description: Release channel
        type: choice
        required: true
        default: nightly
        options: [nightly, main]

permissions:
  contents: write

env:
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select release channel
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_CHANNEL: ${{ inputs.release_channel }}
        run: |
          set -euo pipefail
          CHANNEL=nightly
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$INPUT_CHANNEL" == "main" ]]; then CHANNEL=main; fi
          if [[ "$CHANNEL" == "main" ]]; then
            echo "target=iSteam" >> "$GITHUB_OUTPUT"
            echo "bundle=com.Xthrx.iSteam" >> "$GITHUB_OUTPUT"
            echo "ipa_name=iSteam-release.ipa" >> "$GITHUB_OUTPUT"
            echo "icon=https://i-steam.github.io/IMG_3524.jpeg" >> "$GITHUB_OUTPUT"
            echo "tag=main-$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
            echo "name=i-Steam Main Build #$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "target=iSteamNightly" >> "$GITHUB_OUTPUT"
            echo "bundle=com.Xthrx.iSteam.Nightly" >> "$GITHUB_OUTPUT"
            echo "ipa_name=iSteam-nightly.ipa" >> "$GITHUB_OUTPUT"
            echo "icon=https://i-steam.github.io/IMG_3523.jpeg" >> "$GITHUB_OUTPUT"
            echo "tag=nightly-$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
            echo "name=i-Steam Nightly #$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          if [[ "$CHANNEL" == "nightly" ]]; then
            echo "::warning title=Nightly build::Experimental unsigned prototype; sign with SideStore before installing."
          fi

      - name: Show toolchain
        run: |
          xcodebuild -version
          cmake --version
          brew --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build iOS device archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          set -o pipefail
          TARGET="${{ steps.release.outputs.target }}"
          xcodebuild -project iSteam.xcodeproj -scheme "$TARGET" -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -archivePath "$PWD/build/$TARGET.xcarchive" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" ARCHS=arm64 ONLY_ACTIVE_ARCH=NO OTHER_LDFLAGS="-ObjC -framework Metal -framework MetalKit" archive 2>&1 | tee build/archive.log

      - name: Verify executable metadata
        shell: bash
        run: |
          set -euo pipefail
          APP="$PWD/build/${{ steps.release.outputs.target }}.xcarchive/Products/Applications/iSteam.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Info.plist")
          test -n "$EXECUTABLE" && test -f "$APP/$EXECUTABLE"
          file "$APP/$EXECUTABLE"

      - name: Package and validate unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="$PWD/build/${{ steps.release.outputs.target }}.xcarchive/Products/Applications/iSteam.app"
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/iSteam.app
          IPA_NAME="${{ steps.release.outputs.ipa_name }}"
          ditto -c -k --sequesterRsrc --keepParent build/Payload "build/$IPA_NAME"
          unzip -t "build/$IPA_NAME" >/dev/null
          unzip -p "build/$IPA_NAME" Payload/iSteam.app/Info.plist > build/packaged-Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" build/packaged-Info.plist | grep -Fx iSteam
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" build/packaged-Info.plist | grep -Fx "${{ steps.release.outputs.bundle }}"
          shasum -a 256 "build/$IPA_NAME" | tee "build/$IPA_NAME.sha256"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: iSteam-SideStore
          path: |
            build/${{ steps.release.outputs.ipa_name }}
            build/${{ steps.release.outputs.ipa_name }}.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload Xcode archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: iSteam-xcarchive
          path: build/${{ steps.release.outputs.target }}.xcarchive
          if-no-files-found: error
          retention-days: 7

      - name: Create release notes
        run: |
          cat > build/RELEASE_NOTES.md <<'EOF'
          ## Prototype warning
          Experimental unsigned iOS prototype. A successful build does not mean guest operating systems or games boot. Sign the IPA with SideStore before installation.

          ## Build details
          - Channel: ${{ steps.release.outputs.channel }}
          - Commit: ${{ github.sha }}
          - Install guide: https://github.com/I-Steam/I-steam/blob/main/INSTALL.md
          - Project status: https://github.com/I-Steam/I-steam/blob/main/README.md
          EOF

      - name: Publish GitHub release (optional mirror)
        id: publish_release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.name }}
          prerelease: ${{ steps.release.outputs.prerelease }}
          target_commitish: ${{ github.sha }}
          body_path: build/RELEASE_NOTES.md
          files: |
            build/${{ steps.release.outputs.ipa_name }}
            build/${{ steps.release.outputs.ipa_name }}.sha256
          fail_on_unmatched_files: true
          make_latest: ${{ steps.release.outputs.prerelease == 'false' && 'true' || 'false' }}

      # Publish the IPA and source manifest together in one Pages-repository commit.
      # This does not depend on GitHub Releases being enabled for GITHUB_TOKEN.
      - name: Atomically publish AltStore source and IPA
        if: success() || steps.publish_release.outcome == 'failure'
        shell: bash
        env:
          WEBSITE_PUBLISH_TOKEN: ${{ secrets.WEBSITE_PUBLISH_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_NAME: ${{ steps.release.outputs.name }}
          RELEASE_CHANNEL: ${{ steps.release.outputs.channel }}
          SOURCE_REPO: I-Steam/I-steam.github.io
        run: |
          set -euo pipefail
          if [[ -z "$WEBSITE_PUBLISH_TOKEN" ]]; then
            echo "::error title=Missing website token::Add WEBSITE_PUBLISH_TOKEN in I-Steam/I-steam repository Actions secrets. It needs Contents read/write access to I-Steam/I-steam.github.io."
            exit 1
          fi
          RELEASE_SHA256=$(shasum -a 256 build/${{ steps.release.outputs.ipa_name }} | awk '{print $1}')
          RELEASE_SIZE=$(stat -f%z build/${{ steps.release.outputs.ipa_name }})
          RELEASE_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          export RELEASE_SHA256 RELEASE_SIZE RELEASE_DATE
          git clone "https://x-access-token:$WEBSITE_PUBLISH_TOKEN@github.com/$SOURCE_REPO.git" website
          cd website
          mkdir -p downloads
          IPA_NAME="${{ steps.release.outputs.ipa_name }}"
          cp "../build/$IPA_NAME" "downloads/$IPA_NAME"
          cp "../build/$IPA_NAME.sha256" "downloads/$IPA_NAME.sha256"
          export DOWNLOAD_URL="https://i-steam.github.io/downloads/$IPA_NAME"
          export APP_BUNDLE="${{ steps.release.outputs.bundle }}"
          export APP_ICON="${{ steps.release.outputs.icon }}"
          export APP_NAME="i-Steam $RELEASE_CHANNEL"
          python3 - <<'PY'
          import json, os, pathlib
          path = pathlib.Path("AltSource.json")
          source = json.loads(path.read_text()) if path.exists() else {}
          source.update({"name":"I-Steam","subtitle":"Official i-Steam iOS builds","description":"Experimental iOS VM launcher. Guest OS boot and game execution remain under development.","iconURL":"https://i-steam.github.io/IMG_3524.jpeg","website":"https://i-steam.github.io/","tintColor":"#2478C8"})
          source.pop("featuredApps", None)
          source.pop("news", None)
          old_bundle = "com.chantinlongx.iSteam"
          release_bundle = "com.Xthrx.iSteam"
          nightly_bundle = "com.Xthrx.iSteam.Nightly"
          apps = [a for a in source.get("apps", []) if a.get("bundleIdentifier") not in (old_bundle, release_bundle, nightly_bundle)]
          existing = {a.get("bundleIdentifier"): a for a in source.get("apps", []) if a.get("bundleIdentifier") in (release_bundle, nightly_bundle)}
          for bundle, name, icon, subtitle in [
            (release_bundle, "i-Steam Release", "https://i-steam.github.io/IMG_3524.jpeg", "Stable release channel"),
            (nightly_bundle, "i-Steam Nightly", "https://i-steam.github.io/IMG_3523.jpeg", "Nightly experimental builds")
          ]:
            app = existing.get(bundle, {})
            app.update({"name":name,"bundleIdentifier":bundle,"developerName":"Xthrx","subtitle":subtitle,"localizedDescription":"Experimental iOS launcher prototype. Sign the unsigned IPA with SideStore. This is not yet a complete PC emulator.","iconURL":icon,"tintColor":"#2478C8"})
            app["versions"] = app.get("versions", [])
            apps.append(app)
          channel = os.environ["RELEASE_CHANNEL"]
          bundle = os.environ["APP_BUNDLE"]
          app = next(a for a in apps if a.get("bundleIdentifier") == bundle)
          version = {"version":os.environ["RELEASE_TAG"],"date":os.environ["RELEASE_DATE"],"size":int(os.environ["RELEASE_SIZE"]),"downloadURL":os.environ["DOWNLOAD_URL"],"localizedDescription":channel.upper()+" build. SHA-256: "+os.environ["RELEASE_SHA256"]+". Unsigned prototype; sign with SideStore before installing.","minOSVersion":"16.0"}
          versions = app.setdefault("versions", [])
          versions[:] = [v for v in versions if v.get("version") != version["version"]]
          versions.insert(0, version)
          app["versions"] = versions[:10]
          source["apps"] = apps
          path.write_text(json.dumps(source, indent=2, ensure_ascii=False) + chr(10))
          PY
          cat > index.html <<'HTML'
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>I-Steam</title></head>
          <body><main><h1>I-Steam</h1><p>Experimental iOS VM launcher prototype. Guest OS boot and game execution are under development.</p>
          <p><a href="/AltSource.json">Add I-Steam to AltStore / SideStore</a></p>
          <p><a href="https://github.com/I-Steam/I-steam/actions">Browse build artifacts</a></p></main></body></html>
          HTML
          git config user.name "i-Steam release bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add AltSource.json index.html "downloads/$IPA_NAME" "downloads/$IPA_NAME.sha256"
          git commit -m "Publish i-Steam $RELEASE_CHANNEL $RELEASE_TAG"
          # GitLab mirror syncs may update the Pages repo at the same time.
          # Merge remote changes while preserving this build's newly generated manifest.
          git pull --no-rebase -X ours origin main
          git push origin HEAD:main

      - name: Explain failure
        if: failure()
        shell: bash
        run: |
          {
            echo "## Build or publish failed"
            echo
            echo "No successful end-to-end publication is claimed. Inspect the first failing step."
            echo "Workflow: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"
