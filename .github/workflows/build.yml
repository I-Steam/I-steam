name: Build i-Steam IPA and Release

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      release_channel:
        description: Release channel
        type: choice
        required: true
        default: nightly
        options:
          - nightly
          - main

permissions:
  contents: write

env:
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select release channel
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_CHANNEL: ${{ inputs.release_channel }}
        run: |
          set -euo pipefail
          CHANNEL=nightly
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$INPUT_CHANNEL" == "main" ]]; then CHANNEL=main; fi
          if [[ "$CHANNEL" == "main" ]]; then
            echo "tag=main-$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
            echo "name=i-Steam Main Build #$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=nightly-$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
            echo "name=i-Steam Nightly #$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
          echo "channel=$CHANNEL"
          if [[ "$CHANNEL" == "nightly" ]]; then
            echo "::warning title=Nightly build::This is an experimental, unsigned prototype build. Runtime features may be incomplete; sign the IPA before installing."
          fi

      - name: Show toolchain
        run: |
          xcodebuild -version
          cmake --version
          brew --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build iOS device archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          set -o pipefail
          xcodebuild -project iSteam.xcodeproj -scheme iSteam -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -archivePath "$PWD/build/iSteam.xcarchive" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" ARCHS=arm64 ONLY_ACTIVE_ARCH=NO OTHER_LDFLAGS="-ObjC -framework Metal -framework MetalKit" archive 2>&1 | tee build/archive.log

      - name: Verify executable metadata
        shell: bash
        run: |
          set -euo pipefail
          APP="$PWD/build/iSteam.xcarchive/Products/Applications/iSteam.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Info.plist")
          test -n "$EXECUTABLE" && test -f "$APP/$EXECUTABLE"
          file "$APP/$EXECUTABLE"

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="$PWD/build/iSteam.xcarchive/Products/Applications/iSteam.app"
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/iSteam.app
          ditto -c -k --sequesterRsrc --keepParent build/Payload build/iSteam-SideStore.ipa
          unzip -t build/iSteam-SideStore.ipa >/dev/null
          unzip -p build/iSteam-SideStore.ipa Payload/iSteam.app/Info.plist > build/packaged-Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" build/packaged-Info.plist | grep -Fx iSteam

      - name: Upload SideStore IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: iSteam-SideStore
          path: build/iSteam-SideStore.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload Xcode archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: iSteam-xcarchive
          path: build/iSteam.xcarchive
          if-no-files-found: error
          retention-days: 7

      - name: Checkout AltStore website
        uses: actions/checkout@v4
        with:
          repository: I-Steam/I-steam.github.io
          ref: main
          token: ${{ secrets.PAGES_TOKEN }}
          path: website

      - name: Publish IPA and AltStore source atomically
        shell: bash
        env:
          BUILD_CHANNEL: ${{ steps.release.outputs.channel }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          IPA="$PWD/build/iSteam-SideStore.ipa"
          BYTES=$(stat -f '%z' "$IPA")
          if (( BYTES >= 94371840 )); then
            echo "::error::IPA is 90 MiB or larger; use release-backed hosting instead of a GitHub Pages binary."
            exit 1
          fi
          mkdir -p website/alt-source/apps
          install -m 0644 "$IPA" website/alt-source/apps/iSteam-SideStore.ipa
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/packaged-Info.plist 2>/dev/null || echo "0.1.0")
          APP_BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' build/packaged-Info.plist 2>/dev/null || echo "$GITHUB_RUN_NUMBER")
          export BYTES VERSION APP_BUILD BUILD_CHANNEL SOURCE_COMMIT
          python3 - <<'PY' > website/alt-source.json
          import datetime, json, os
          print(json.dumps({
            "name":"i-Steam AltStore Source",
            "subtitle":"Experimental i-Steam iOS builds",
            "description":"Experimental unsigned prototype. A successful build does not mean guest operating systems or games can boot.",
            "website":"https://i-steam.github.io/",
            "apps":[{
              "name":"i-Steam",
              "bundleIdentifier":"com.chantinlongx.iSteam",
              "developerName":"I-Steam",
              "subtitle":"Experimental PC-emulation frontend",
              "localizedDescription":"Experimental iOS frontend and incomplete guest runtime. Sign with SideStore before installing; operating systems and games are not yet supported end-to-end.",
              "tintColor":"#5B8DEF",
              "category":"utilities",
              "versions":[{
                "version":os.environ["VERSION"],
                "buildVersion":os.environ["APP_BUILD"],
                "date":datetime.datetime.now(datetime.timezone.utc).isoformat().replace("+00:00","Z"),
                "downloadURL":"https://i-steam.github.io/alt-source/apps/iSteam-SideStore.ipa",
                "size":int(os.environ["BYTES"]),
                "versionDescription":os.environ["BUILD_CHANNEL"]+" build from "+os.environ["SOURCE_COMMIT"][:12]+"; unsigned."
              }]
            }]
          }, indent=2))
          PY
          printf 'IPA SHA-256: %s\nCommit: %s\nChannel: %s\n' "$(shasum -a 256 "$IPA" | awk '{print $1}')" "$SOURCE_COMMIT" "$BUILD_CHANNEL" > website/alt-source/BUILD-INFO.txt
          git -C website config user.name "i-Steam Build Bot"
          git -C website config user.email "actions@users.noreply.github.com"
          git -C website add alt-source/apps/iSteam-SideStore.ipa alt-source.json alt-source/BUILD-INFO.txt
          git -C website commit -m "Publish i-Steam $VERSION build $GITHUB_RUN_NUMBER ($BUILD_CHANNEL)"
          git -C website push origin HEAD:main
          echo "AltStore source: https://i-steam.github.io/alt-source.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Create release notes
        run: |
          cat > build/RELEASE_NOTES.md <<'EOF'
          ## ⚠️ Nightly / prototype warning

          This is an experimental, unsigned iOS prototype. Features may be incomplete, and a successful build does not mean games or guest operating systems will boot. Sign the IPA with SideStore before installation.

          ## Build details

          - Build channel: ${{ steps.release.outputs.channel }}
          - Commit: ${{ github.sha }}
          - Install guide: https://github.com/I-Steam/I-steam/blob/main/INSTALL.md
          - Project status and credits: https://github.com/I-Steam/I-steam/blob/main/README.md
          EOF

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.name }}
          prerelease: ${{ steps.release.outputs.prerelease }}
          target_commitish: ${{ github.sha }}
          body_path: build/RELEASE_NOTES.md
          files: build/iSteam-SideStore.ipa
          fail_on_unmatched_files: true
          make_latest: ${{ steps.release.outputs.prerelease == 'false' && 'true' || 'false' }}

      - name: Explain failure and warn about missing release
        if: failure()
        shell: bash
        run: |
          {
            echo "## ⚠️ Build failed — no release was published"
            echo
            echo "The first failing step above contains the actionable compiler or packaging error."
            echo "No nightly/main release is created unless all required device-archive and packaging steps pass."
            echo "See the full logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=Release not published::The build failed; fix the first failing step before expecting a nightly or main release."
