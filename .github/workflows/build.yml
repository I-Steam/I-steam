name: Legacy i-Steam build (use platform workflows)
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform workflow to run instead
        type: choice
        required: true
        default: iOS
        options: [iOS, tvOS]
permissions:
  contents: read
jobs:
  redirect:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Use the dedicated workflows: iOS Nightly or tvOS Nightly."
          echo "Run them from Actions to build one platform and publish its own nightly tag."
