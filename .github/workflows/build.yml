name: Build i-Steam IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Show toolchain
        run: |
          xcodebuild -version
          cmake --version
          brew --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build iSteam
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build
          mkdir -p build

          xcodebuild             -project iSteam.xcodeproj             -scheme iSteam             -configuration Release             -sdk iphoneos             -destination 'generic/platform=iOS'             -archivePath "$PWD/build/iSteam.xcarchive"             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=""             ARCHS="arm64"             ONLY_ACTIVE_ARCH=NO             OTHER_LDFLAGS="-ObjC -framework Metal -framework MetalKit"             archive

      - name: Verify app bundle
        shell: bash
        run: |
          set -euo pipefail
          APP="$PWD/build/iSteam.xcarchive/Products/Applications/iSteam.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"
          /usr/bin/codesign --display --verbose=2 "$APP" 2>&1 || true

      - name: Package unsigned SideStore IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="$PWD/build/iSteam.xcarchive/Products/Applications/iSteam.app"
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/iSteam.app
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent build/Payload build/iSteam-SideStore.ipa
          unzip -t build/iSteam-SideStore.ipa >/dev/null

      - name: Upload SideStore IPA
        uses: actions/upload-artifact@v4
        with:
          name: iSteam-SideStore
          path: build/iSteam-SideStore.ipa
          if-no-files-found: error

      - name: Upload Xcode archive
        uses: actions/upload-artifact@v4
        with:
          name: iSteam-xcarchive
          path: build/iSteam.xcarchive
          if-no-files-found: error
