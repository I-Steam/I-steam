name: Build UTM iOS QEMU runtime (manual)

on:
  workflow_dispatch:
    inputs:
      rebuild_dependencies:
        description: Rebuild UTM dependencies instead of reusing the runner cache
        type: boolean
        required: true
        default: false
  workflow_call:
    inputs:
      rebuild_dependencies:
        description: Rebuild UTM dependencies instead of reusing the runner cache
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  # Separate diagnostic manual runs from calls inside the release workflow.
  group: qemu-runtime-ios-arm64-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build-utm-runtime:
    runs-on: macos-15
    timeout-minutes: 350
    steps:
      - name: Checkout i-Steam
        uses: actions/checkout@v4

      - name: Checkout UTM with submodules
        id: utm-source
        uses: actions/checkout@v4
        with:
          repository: utmapp/UTM
          ref: main
          path: UTM
          submodules: recursive
          fetch-depth: 1

      - name: Select Xcode
        run: |
          set -euo pipefail
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install UTM build dependencies
        run: |
          set -euo pipefail
          brew install bison pkg-config gettext glib libgpg-error nasm meson cmake llvm spirv-llvm-translator libxcb libxrandr
          python3 -m pip install --break-system-packages six pyparsing pyyaml setuptools distlib mako
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

          # UTM's QEMU link step uses platform-availability checks. Homebrew LLVM
          # does not ship an iOS compiler-rt, so force-load Apple's iOS runtime
          # from the active Xcode toolchain when the linker builds QEMU dylibs.
          CLANG="$(xcrun --sdk iphoneos --find clang)"
          RESOURCE_DIR="$("$CLANG" -print-resource-dir)"
          RUNTIME="$RESOURCE_DIR/lib/darwin/libclang_rt.ios.a"
          if [ ! -f "$RUNTIME" ]; then
            RUNTIME="$(find "$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib/clang" -path '*/lib/darwin/libclang_rt.ios.a' -print -quit)"
          fi
          if [ -z "$RUNTIME" ] || [ ! -f "$RUNTIME" ]; then
            echo "Apple's libclang_rt.ios.a was not found in the selected Xcode toolchain." >&2
            exit 1
          fi
          echo "IOS_COMPILER_RT=$RUNTIME" >> "$GITHUB_ENV"
          echo "Using iOS compiler runtime: $RUNTIME"

      - name: Cache UTM dependency build and sysroot
        if: ${{ !inputs.rebuild_dependencies }}
        uses: actions/cache@v4
        with:
          path: |
            UTM/build-iOS-arm64
            UTM/sysroot-iOS-arm64
          # Include the workflow itself: Meson cross-file fixes change build configuration.
          # A workflow-only fix must not reuse a QEMU build tree configured without it.
          key: utm-ios-arm64-deps-v5-${{ steps.utm-source.outputs.commit }}-${{ hashFiles('.github/workflows/build-qemu-runtime.yml', 'scripts/package-utm-qemu-runtime.sh') }}

      - name: Build UTM dependencies for physical iOS arm64
        shell: bash
        env:
          NCPU: "2"
        run: |
          set -euo pipefail
          cd UTM
          # Apply compiler-rt only to QEMU's link flags, not every third-party
          # dependency; globally force-loading it bloats or breaks other builds.
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/build_dependencies.sh")
          source = path.read_text()
          # UTM's current script writes Meson feature overrides in generate_meson_cross().
          # Match current upstream syntax (unquoted $cross); fail clearly if upstream changes.
          cross_marker = 'echo "has_function_dup3 = false" >> $cross'
          cross_override = 'echo "has_function_posix_memalign = true" >> $cross'
          if cross_override not in source:
              if cross_marker not in source:
                  raise SystemExit("Could not locate Meson cross-file feature overrides in UTM/scripts/build_dependencies.sh")
              source = source.replace(cross_marker, cross_marker + '\n    ' + cross_override, 1)
          if cross_override not in source:
              raise SystemExit("Meson cross-file posix_memalign override was not installed")
          needle = 'if [ -z "$DEBUG" ]; then\n    QEMU_DEBUG_FLAGS="--disable-debug-info"'
          replacement = 'QEMU_PLATFORM_BUILD_FLAGS="$QEMU_PLATFORM_BUILD_FLAGS --target-list=x86_64-softmmu"\n\n' + needle
          if needle not in source:
              raise SystemExit("Could not locate QEMU build flag insertion point")
          source = source.replace(needle, replacement, 1)
          # QEMU's own configure generates config-meson.cross independently of
          # UTM's meson-auto.cross. Patch QEMU's host feature probe itself: the
          # same iOS SDK/compiler has already passed Autoconf's posix_memalign
          # checks, but QEMU's generated cross-file incorrectly reports NO.
          qemu_build = 'build $QEMU_DIR --cross-prefix="" $QEMU_PLATFORM_BUILD_FLAGS $QEMU_DEBUG_FLAGS'
          qemu_patch = """python3 - "$QEMU_DIR/meson.build" <<'QEMU_MEMALIGN_PATCH'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          source = path.read_text()
          old = "config_host_data.set('CONFIG_POSIX_MEMALIGN', cc.has_function('posix_memalign', prefix: '#include <stdlib.h>'))"
          new = "config_host_data.set('CONFIG_POSIX_MEMALIGN', true)"
          if new not in source:
              if old not in source:
                  raise SystemExit("Could not locate QEMU CONFIG_POSIX_MEMALIGN feature probe")
              source = source.replace(old, new, 1)
          # QEMU's Meson targets do not inherit LDFLAGS reliably. Explicitly
          # force-load Apple's compiler-rt archive into C-linked QEMU targets so
          # __isPlatformVersionAtLeast from tcg/region.c is resolved even when
          # archive member ordering would otherwise leave it unreferenced.
          link_marker = "add_project_link_arguments('-Wl,-force_load,' + ios_compiler_rt, language: 'c')"
          if link_marker not in source:
              project_start = source.find("project(")
              if project_start < 0:
                  raise SystemExit("Could not find QEMU Meson project() declaration")
              depth = 0
              quote = None
              escaped = False
              project_end = None
              for i in range(project_start + len("project"), len(source)):
                  ch = source[i]
                  if quote:
                      if escaped:
                          escaped = False
                      elif ch == "\\\\":
                          escaped = True
                      elif ch == quote:
                          quote = None
                      continue
                  if ch in ("'", '"'):
                      quote = ch
                  elif ch == "(":
                      depth += 1
                  elif ch == ")":
                      depth -= 1
                      if depth == 0:
                          project_end = i + 1
                          break
              if project_end is None:
                  raise SystemExit("Could not parse QEMU Meson project() declaration")
              link_block = r'''
          # i-Steam iOS cross-build: force-load Apple's compiler runtime for platform checks.
          ios_compiler_rt = run_command('sh', '-c', 'printf "%s" "$IOS_COMPILER_RT"', check: true).stdout().strip()
          if ios_compiler_rt != ''
            add_project_link_arguments('-Wl,-force_load,' + ios_compiler_rt, language: 'c')
          endif
          '''
              line_end = source.find("\\n", project_end)
              if line_end < 0:
                  line_end = project_end
              source = source[:line_end + 1] + link_block + source[line_end + 1:]
          path.write_text(source)
          print("Forced QEMU POSIX_MEMALIGN and added explicit Apple compiler-rt link arguments for iOS.")
          QEMU_MEMALIGN_PATCH
          """
          if qemu_patch.strip() not in source:
              if qemu_build not in source:
                  raise SystemExit("Could not locate QEMU build invocation for the iOS memalign patch")
              source = source.replace(qemu_build, qemu_patch + "\n" + qemu_build, 1)
          path.write_text(source)
          print("Installed Meson override, QEMU POSIX_MEMALIGN patch, and iOS compiler-rt linker flag.")
          PY
          grep -F 'has_function_posix_memalign = true' scripts/build_dependencies.sh
          if [ "${{ inputs.rebuild_dependencies }}" = "true" ] || [ ! -f build-iOS-arm64/BUILD_SUCCESS ]; then
            ./scripts/build_dependencies.sh -p ios -a arm64
          else
            echo "Using the cached iOS arm64 dependency build."
          fi
          test -f build-iOS-arm64/BUILD_SUCCESS
          test -d sysroot-iOS-arm64

      - name: Build UTM iOS archive
        shell: bash
        run: |
          set -euo pipefail
          cd UTM
          ./scripts/build_utm.sh -k iphoneos -s iOS -a arm64 -o UTMBuild
          test -d UTMBuild.xcarchive/Products/Applications/UTM.app

      - name: Package and verify in-process QEMU runtime
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/package-utm-qemu-runtime.sh UTM/UTMBuild.xcarchive build/qemu-runtime
          cp UTM/UTMBuild.xcarchive/Info.plist build/qemu-runtime/UTM-archive-Info.plist
          echo "UTM revision: $(git -C UTM rev-parse HEAD)" >> build/qemu-runtime/BUILD-INFO.txt
          cat build/qemu-runtime/BUILD-INFO.txt

      - name: Upload verified QEMU runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: iSteam-qemu-runtime-ios-arm64
          path: build/qemu-runtime/
          if-no-files-found: error
          retention-days: 14
