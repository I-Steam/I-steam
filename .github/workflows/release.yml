name: i-Steam Build & Release

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: Choose which release channel to publish (both iOS and tvOS)
        type: choice
        required: true
        default: Nightly
        options:
          - Nightly
          - Main

permissions:
  contents: write

concurrency:
  group: isteam-release
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }} (${{ matrix.channel }})
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform: [iOS, tvOS, visionOS]
        channel: ${{ fromJSON(format('["{0}"]', github.event_name == 'workflow_dispatch' && inputs.channel == 'Main' && 'main' || 'nightly')) }}
    env:
      RELEASE_CHANNEL: ${{ matrix.channel }}
      VERSION: 0.1.${{ format('{0}', github.run_number) }}
      PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-xcodegen-${{ runner.os }}-v1

      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build and package iOS IPA
        if: matrix.platform == 'iOS'
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RELEASE_CHANNEL" = "main" ]; then
            SCHEME="iSteam"
            EXPECTED_BUNDLE="com.xthrx.isteam"
          else
            SCHEME="iSteamNightly"
            EXPECTED_BUNDLE="com.xthrx.isteam.nightly"
          fi
          VERSION="0.1.$(printf '%03d' "$GITHUB_RUN_NUMBER")"
          xcodebuild -project iSteam.xcodeproj -scheme "$SCHEME" -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -archivePath "$PWD/build/iSteam.xcarchive" MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" ARCHS=arm64 archive
          APP="build/iSteam.xcarchive/Products/Applications/iSteam.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist" | grep -Fx "$EXPECTED_BUNDLE"
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/iSteam.app
          ditto -c -k --sequesterRsrc --keepParent build/Payload build/iSteam-ios.ipa
          unzip -t build/iSteam-ios.ipa >/dev/null
          shasum -a 256 build/iSteam-ios.ipa > build/iSteam-ios.ipa.sha256

      - name: Build and package tvOS IPA
        if: matrix.platform == 'tvOS'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="0.1.$(printf '%03d' "$GITHUB_RUN_NUMBER")"
          if [ "$RELEASE_CHANNEL" = "main" ]; then
            EXPECTED_BUNDLE="com.xthrx.isteam.tvos"
          else
            EXPECTED_BUNDLE="com.xthrx.isteam.tvos.nightly"
          fi
          xcodebuild -project iSteam.xcodeproj -scheme iSteamTV -configuration Release -sdk appletvos -destination 'generic/platform=tvOS' -derivedDataPath "$PWD/build/tvDerivedData" MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" PRODUCT_BUNDLE_IDENTIFIER="$EXPECTED_BUNDLE" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" ARCHS=arm64 build
          APP="build/tvDerivedData/Build/Products/Release-appletvos/iSteamTV.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist" | grep -Fx "$EXPECTED_BUNDLE"
          mkdir -p build/tvPayload/Payload
          cp -R "$APP" build/tvPayload/Payload/iSteamTV.app
          ditto -c -k --sequesterRsrc --keepParent build/tvPayload/Payload build/iSteam-tvOS.ipa
          unzip -t build/iSteam-tvOS.ipa >/dev/null
          unzip -t build/iSteam-visionOS.ipa >/dev/null
          unzip -Z1 build/iSteam-tvOS.ipa | grep -q '^Payload/iSteamTV.app/Info.plist          shasum -a 256 build/iSteam-tvOS.ipa > build/iSteam-tvOS.ipa.sha256

      - name: Build and package visionOS IPA
        if: matrix.platform == 'visionOS'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="0.1.$(printf '%03d' "$GITHUB_RUN_NUMBER")"
          if [ "$RELEASE_CHANNEL" = "main" ]; then EXPECTED_BUNDLE="com.xthrx.isteam.visionos"; else EXPECTED_BUNDLE="com.xthrx.isteam.visionos.nightly"; fi
          xcodebuild -project iSteam.xcodeproj -scheme iSteamVision -configuration Release -sdk xros -destination 'generic/platform=visionOS' -derivedDataPath "$PWD/build/visionDerivedData" MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" PRODUCT_BUNDLE_IDENTIFIER="$EXPECTED_BUNDLE" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" ARCHS=arm64 build
          APP="build/visionDerivedData/Build/Products/Release-xros/iSteamVision.app"
          test -d "$APP"
          mkdir -p build/visionPayload/Payload
          cp -R "$APP" build/visionPayload/Payload/iSteamVision.app
          ditto -c -k --sequesterRsrc --keepParent build/visionPayload/Payload build/iSteam-visionOS.ipa
          unzip -t build/iSteam-visionOS.ipa >/dev/null
          unzip -Z1 build/iSteam-visionOS.ipa | grep -q '^Payload/iSteamVision.app/Info.plist        uses: actions/upload-artifact@v4
        with:
          name: iSteam-${{ matrix.platform }}-${{ matrix.channel }}
          path: |
            build/iSteam-ios.ipa
            build/iSteam-ios.ipa.sha256
            build/iSteam-tvOS.ipa
            build/iSteam-tvOS.ipa.sha256
            build/iSteam-visionOS.ipa
            build/iSteam-visionOS.ipa.sha256
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Publish combined ${{ matrix.channel }} release
    needs: build
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        channel: ${{ fromJSON(format('["{0}"]', github.event_name == 'workflow_dispatch' && inputs.channel == 'Main' && 'main' || 'nightly')) }}
    env:
      RELEASE_CHANNEL: ${{ matrix.channel }}
      VERSION: 0.1.${{ format('{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download iOS build
        uses: actions/download-artifact@v4
        with:
          name: iSteam-iOS-${{ matrix.channel }}
          path: build

      - name: Download tvOS build
        uses: actions/download-artifact@v4
        with:
          name: iSteam-tvOS-${{ matrix.channel }}
          path: build

      - name: Download visionOS build
        uses: actions/download-artifact@v4
        with:
          name: iSteam-visionOS-${{ matrix.channel }}
          path: build

      - name: Verify combined release assets
        run: |
          set -euo pipefail
          test -s build/iSteam-ios.ipa
          test -s build/iSteam-ios.ipa.sha256
          test -s build/iSteam-tvOS.ipa
          test -s build/iSteam-tvOS.ipa.sha256
          test -s build/iSteam-visionOS.ipa
          test -s build/iSteam-visionOS.ipa.sha256
          unzip -t build/iSteam-ios.ipa >/dev/null
          unzip -t build/iSteam-tvOS.ipa >/dev/null
          shasum -a 256 -c build/iSteam-ios.ipa.sha256
          shasum -a 256 -c build/iSteam-tvOS.ipa.sha256
          shasum -a 256 -c build/iSteam-visionOS.ipa.sha256

      - name: Set release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="0.1.$(printf '%03d' "$GITHUB_RUN_NUMBER")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_CHANNEL" >> "$GITHUB_OUTPUT"
          if [ "$RELEASE_CHANNEL" = "main" ]; then
            echo "title=$VERSION Main (iOS + tvOS)" >> "$GITHUB_OUTPUT"
          else
            echo "title=$VERSION Nightly (iOS + tvOS)" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish combined release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          prerelease: ${{ env.RELEASE_CHANNEL == 'nightly' }}
          make_latest: ${{ env.RELEASE_CHANNEL == 'main' && 'true' || 'false' }}
          overwrite_files: true
          files: |
            build/iSteam-ios.ipa
            build/iSteam-ios.ipa.sha256
            build/iSteam-tvOS.ipa
            build/iSteam-tvOS.ipa.sha256
            build/iSteam-visionOS.ipa
            build/iSteam-visionOS.ipa.sha256
          body: |
            i-Steam ${{ matrix.channel }} build ${{ steps.meta.outputs.version }}.

            Includes both platform builds:
            - **iOS:** `iSteam-ios.ipa`
            - **tvOS:** `iSteam-tvOS.ipa`
            - **visionOS:** `iSteam-visionOS.ipa`

            These are unsigned prototype builds. Sign them with a compatible signer before installing.

      - name: Checkout AltStore website
        if: (matrix.channel == 'nightly' || github.event_name == 'workflow_dispatch') && env.PAGES_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: I-Steam/I-steam.github.io
          ref: main
          token: ${{ secrets.PAGES_TOKEN }}
          path: website

      - name: Update legacy AltStore source and publish iOS IPA
        if: (matrix.channel == 'nightly' || github.event_name == 'workflow_dispatch') && env.PAGES_TOKEN != ''
        env:
          PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}
          BUILD_NUMBER: ${{ github.run_number }}
          CHANNEL: ${{ matrix.channel }}
          VERSION: ${{ steps.meta.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PAGES_TOKEN" || { echo "PAGES_TOKEN must have Contents write access to I-Steam/I-steam.github.io"; exit 1; }
          python3 - <<'PY'
          import datetime, hashlib, json, os, shutil
          from pathlib import Path

          website = Path("website")
          downloads = website / "downloads"
          downloads.mkdir(parents=True, exist_ok=True)
          channel = os.environ["CHANNEL"]
          build_number = os.environ["BUILD_NUMBER"]
          current_version = os.environ["VERSION"]
          channels = [
              (channel, "ios", Path("build/iSteam-ios.ipa"), current_version),
              (channel, "tvos", Path("build/iSteam-tvOS.ipa"), current_version),
          ]

          manifest_path = website / "AltSource.json"
          manifest = json.loads(manifest_path.read_text())
          for item_channel, platform, ipa_path, version in channels:
              if not ipa_path.is_file():
                  raise SystemExit(f"Missing {platform} IPA for {item_channel}: {ipa_path}")
              data = ipa_path.read_bytes()
              digest = hashlib.sha256(data).hexdigest()
              now = datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")
              nightly = item_channel == "nightly"
              tvos = platform == "tvos"
              if tvos:
                  bundle_id = "com.xthrx.isteam.tvos.nightly" if nightly else "com.xthrx.isteam.tvos"
                  app_name = "i-Steam tvOS Nightly" if nightly else "i-Steam tvOS Main"
                  stable_name = "iSteam-tvOS-nightly.ipa" if nightly else "iSteam-tvOS-main.ipa"
              else:
                  bundle_id = "com.xthrx.isteam.nightly" if nightly else "com.xthrx.isteam"
                  app_name = "i-Steam Nightly" if nightly else "i-Steam Release"
                  stable_name = "iSteam-nightly.ipa" if nightly else "iSteam-release.ipa"
              versioned_name = f"iSteam-{platform}-{item_channel}-{version}.ipa"
              shutil.copy2(ipa_path, downloads / versioned_name)
              shutil.copy2(ipa_path, downloads / stable_name)
              (downloads / (stable_name + ".sha256")).write_text(f"{digest}  {stable_name}\\n")
              platform_label = "tvOS / Apple TV" if tvos else "iOS"
              entry = {
                  "version": version,
                  "buildVersion": str(build_number),
                  "date": now,
                  "size": len(data),
                  "sha256": digest,
                  "downloadURL": f"https://i-steam.github.io/downloads/{versioned_name}",
                  "localizedDescription": f"{item_channel.upper()} {platform_label} build {version}. SHA-256: {digest}. Unsigned prototype; use a compatible signing method before installing.",
                  "minOSVersion": "16.0"
              }
              found = False
              for app in manifest.get("apps", []):
                  if app.get("name") == app_name:
                      app["bundleIdentifier"] = bundle_id
                      versions = app.setdefault("versions", [])
                      versions = [v for v in versions if not (v.get("version") == version and str(v.get("buildVersion", "")) == str(build_number))]
                      app["versions"] = ([entry] + versions)[:10]
                      found = True
              if not found:
                  raise SystemExit(f"Could not find AltStore app entry: {app_name}")

          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n")
          alt_path = website / "alt" / "source.json"
          if alt_path.exists():
              alt = json.loads(alt_path.read_text())
              stable_apps = {
                  "i-steam release": ("com.xthrx.isteam", "https://i-steam.github.io/downloads/iSteam-release.ipa"),
                  "i-steam nightly": ("com.xthrx.isteam.nightly", "https://i-steam.github.io/downloads/iSteam-nightly.ipa"),
                  "i-steam tvos main": ("com.xthrx.isteam.tvos", "https://i-steam.github.io/downloads/iSteam-tvOS-main.ipa"),
                  "i-steam tvos nightly": ("com.xthrx.isteam.tvos.nightly", "https://i-steam.github.io/downloads/iSteam-tvOS-nightly.ipa"),
              }
              for app in alt.get("apps", []):
                  config = stable_apps.get(app.get("name", "").lower())
                  if config:
                      app["bundleIdentifier"], app["downloadURL"] = config
              alt_path.write_text(json.dumps(alt, indent=2) + "\n")
          PY
          git -C website config user.name "i-Steam Release Bot"
          git -C website config user.email "release-bot@users.noreply.github.com"
          git -C website add AltSource.json alt/source.json downloads
          if git -C website diff --cached --quiet; then
            echo "AltStore source already up to date."
          else
            git -C website commit -m "Publish iOS ${{ matrix.channel }} build ${{ steps.meta.outputs.version }}"
            git -C website push origin HEAD:main
          fi


          shasum -a 256 build/iSteam-visionOS.ipa > build/iSteam-visionOS.ipa.sha256
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: iSteam-${{ matrix.platform }}-${{ matrix.channel }}
          path: |
            build/iSteam-ios.ipa
            build/iSteam-ios.ipa.sha256
            build/iSteam-tvOS.ipa
            build/iSteam-tvOS.ipa.sha256
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Publish combined ${{ matrix.channel }} release
    needs: build
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        channel: ${{ fromJSON(format('["{0}"]', github.event_name == 'workflow_dispatch' && inputs.channel == 'Main' && 'main' || 'nightly')) }}
