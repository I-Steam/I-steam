                  "i-steam tvos main": ("com.xthrx.isteam.tvos", "https://i-steam.github.io/downloads/iSteam-tvOS-main.ipa"),
                  "i-steam tvos nightly": ("com.xthrx.isteam.tvos.nightly", "https://i-steam.github.io/downloads/iSteam-tvOS-nightly.ipa"),
