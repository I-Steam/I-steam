          test -s build/iSteam-tvOS.ipa
          test -s build/iSteam-tvOS.ipa.sha256
          unzip -t build/iSteam-ios.ipa >/dev/null
          unzip -t build/iSteam-tvOS.ipa >/dev/null
          shasum -a 256 -c build/iSteam-ios.ipa.sha256
          shasum -a 256 -c build/iSteam-tvOS.ipa.sha256

