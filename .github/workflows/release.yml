        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          prerelease: ${{ env.RELEASE_CHANNEL == 'nightly' }}
          make_latest: ${{ env.RELEASE_CHANNEL == 'main' && 'true' || 'false' }}
          overwrite_files: true
          files: |
            build/iSteam-ios.ipa
            build/iSteam-ios.ipa.sha256
            build/iSteam-tvOS.ipa
