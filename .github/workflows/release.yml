            git -C website push origin HEAD:main
          fi


          unzip -Z1 build/iSteam-visionOS.ipa | grep -q '^Payload/iSteamVision.app/Info.plist          shasum -a 256 build/iSteam-tvOS.ipa > build/iSteam-tvOS.ipa.sha256

