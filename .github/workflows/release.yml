name: i-Steam Build & Release

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        required: true
        default: iOS
        options:
          - iOS
          - tvOS
      channel:
        description: Release channel (automatic runs always use Nightly)
        type: choice
        required: true
        default: nightly
        options:
          - nightly
          - main

permissions:
  contents: write

concurrency:
  group: isteam-release-${{ github.event_name == 'workflow_dispatch' && inputs.platform || 'automatic' }}-${{ github.event_name == 'workflow_dispatch' && inputs.channel || 'nightly' }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }} (${{ github.event_name == 'workflow_dispatch' && inputs.channel || 'nightly' }})
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.platform)) || fromJSON('["iOS","tvOS"]') }}
    env:
      RELEASE_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || 'nightly' }}
      VERSION: 0.1.${{ format('{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-xcodegen-${{ runner.os }}-v1

      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build iOS app
        if: matrix.platform == 'iOS'
        run: |
          set -euo pipefail
          xcodebuild -project iSteam.xcodeproj -scheme "${{ github.event_name == 'workflow_dispatch' && inputs.channel == 'main' && 'iSteam' || 'iSteamNightly' }}" -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -archivePath "$PWD/build/iSteam.xcarchive" MARKETING_VERSION="0.1.$(printf '%03d' "$GITHUB_RUN_NUMBER")" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" ARCHS=arm64 archive
          APP="build/iSteam.xcarchive/Products/Applications/iSteam.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist" | grep -Fx "${{ github.event_name == 'workflow_dispatch' && inputs.channel == 'main' && 'com.xthrx.isteam' || 'com.xthrx.isteam.nightly' }}"
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/iSteam.app
          ditto -c -k --sequesterRsrc --keepParent build/Payload build/iSteam-ios.ipa
          unzip -t build/iSteam-ios.ipa >/dev/null
          shasum -a 256 build/iSteam-ios.ipa > build/iSteam-ios.ipa.sha256

      - name: Build tvOS app
        if: matrix.platform == 'tvOS'
        run: |
          set -euo pipefail
          xcodebuild -project iSteam.xcodeproj -scheme iSteamTV -configuration Release -sdk appletvos -destination 'generic/platform=tvOS' -derivedDataPath "$PWD/build/tvDerivedData" MARKETING_VERSION="0.1.$(printf '%03d' "$GITHUB_RUN_NUMBER")" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" PRODUCT_BUNDLE_IDENTIFIER="${{ github.event_name == 'workflow_dispatch' && inputs.channel == 'main' && 'com.xthrx.isteam.tvos' || 'com.xthrx.isteam.tvos.nightly' }}" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" ARCHS=arm64 build
          APP="build/tvDerivedData/Build/Products/Release-appletvos/iSteamTV.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist" | grep -Fx "${{ github.event_name == 'workflow_dispatch' && inputs.channel == 'main' && 'com.xthrx.isteam.tvos' || 'com.xthrx.isteam.tvos.nightly' }}"
          mkdir -p build/tvPayload
          cp -R "$APP" build/tvPayload/iSteamTV.app
          ditto -c -k --sequesterRsrc --keepParent build/tvPayload build/iSteam-tvOS.ipa
          unzip -t build/iSteam-tvOS.ipa >/dev/null
          shasum -a 256 build/iSteam-tvOS.ipa > build/iSteam-tvOS.ipa.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: iSteam-${{ matrix.platform }}-${{ env.RELEASE_CHANNEL }}
          path: |
            build/iSteam*.ipa
            build/iSteam*.ipa.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Set release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="0.1.$(printf '%03d' "$GITHUB_RUN_NUMBER")"
          PLATFORM="${{ matrix.platform }}"
          CHANNEL="$RELEASE_CHANNEL"
          if [ "$PLATFORM" = "iOS" ]; then
            ASSET="build/iSteam-ios.ipa"
            CHECKSUM="build/iSteam-ios.ipa.sha256"
            PREFIX="ios"
          else
            ASSET="build/iSteam-tvOS.ipa"
            CHECKSUM="build/iSteam-tvOS.ipa.sha256"
            PREFIX="tvos"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$PREFIX-$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "title=$VERSION $PLATFORM $([ "$CHANNEL" = main ] && echo Main || echo Nightly)" >> "$GITHUB_OUTPUT"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
          echo "checksum=$CHECKSUM" >> "$GITHUB_OUTPUT"

      - name: Remove previous channel release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "${{ steps.meta.outputs.tag }}" --yes --cleanup-tag || true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          prerelease: ${{ env.RELEASE_CHANNEL == 'nightly' }}
          make_latest: ${{ env.RELEASE_CHANNEL == 'main' && 'true' || 'false' }}
          files: |
            ${{ steps.meta.outputs.asset }}
            ${{ steps.meta.outputs.checksum }}

      - name: Publish iOS build to AltStore website source
        if: matrix.platform == 'iOS'
        uses: actions/checkout@v4
        with:
          repository: I-Steam/I-steam.github.io
          ref: main
          token: ${{ secrets.PAGES_TOKEN }}
          path: website

      - name: Update AltStore manifests and publish IPA
        if: matrix.platform == 'iOS'
        env:
          RELEASE_CHANNEL: ${{ env.RELEASE_CHANNEL }}
          VERSION: ${{ steps.meta.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ secrets.PAGES_TOKEN }}" || { echo "PAGES_TOKEN is required and must have Contents write access to I-Steam/I-steam.github.io"; exit 1; }
          python3 - <<'PY'
          import datetime, hashlib, json, os, shutil
          from pathlib import Path

          channel = os.environ["RELEASE_CHANNEL"]
          version = os.environ["VERSION"]
          build_number = os.environ["BUILD_NUMBER"]
          source_ipa = Path("build/iSteam-ios.ipa")
          website = Path("website")
          downloads = website / "downloads"
          downloads.mkdir(parents=True, exist_ok=True)
          filename = f"iSteam-{channel}-{version}.ipa"
          versioned_path = downloads / filename
          shutil.copy2(source_ipa, versioned_path)
          stable_name = "iSteam-nightly.ipa" if channel == "nightly" else "iSteam-release.ipa"
          shutil.copy2(source_ipa, downloads / stable_name)

          data = source_ipa.read_bytes()
          digest = hashlib.sha256(data).hexdigest()
          now = datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")
          bundle_id = "com.xthrx.isteam.nightly" if channel == "nightly" else "com.xthrx.isteam"
          app_name = "i-Steam Nightly" if channel == "nightly" else "i-Steam Release"
          download_url = f"https://i-steam.github.io/downloads/{filename}"
          version_entry = {
              "version": version,
              "buildVersion": str(build_number),
              "date": now,
              "size": len(data),
              "sha256": digest,
              "downloadURL": download_url,
              "localizedDescription": f"{'NIGHTLY' if channel == 'nightly' else 'MAIN'} build {version}. SHA-256: {digest}. Unsigned prototype; sign with SideStore before installing.",
              "minOSVersion": "16.0"
          }

          manifest_path = website / "AltSource.json"
          manifest = json.loads(manifest_path.read_text())
          for app in manifest.get("apps", []):
              if app.get("name") == app_name or app.get("bundleIdentifier", "").lower() in ("com.xthrx.isteam", "com.xthrx.isteam.nightly"):
                  app["bundleIdentifier"] = bundle_id
                  if app.get("name") == app_name:
                      versions = app.setdefault("versions", [])
                      versions = [v for v in versions if not (v.get("version") == version and str(v.get("buildVersion", "")) == str(build_number))]
                      app["versions"] = ([version_entry] + versions)[:10]
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\\n")

          alt_path = website / "alt" / "source.json"
          if alt_path.exists():
              alt = json.loads(alt_path.read_text())
              for app in alt.get("apps", []):
                  name = app.get("name", "")
                  if name == app_name or name.lower() in ("i-steam release", "i-steam nightly"):
                      is_nightly = name.lower().endswith("nightly")
                      app["bundleIdentifier"] = "com.xthrx.isteam.nightly" if is_nightly else "com.xthrx.isteam"
                      app["downloadURL"] = f"https://i-steam.github.io/downloads/{'iSteam-nightly.ipa' if is_nightly else 'iSteam-release.ipa'}"
              alt_path.write_text(json.dumps(alt, indent=2) + "\\n")

          checksum_path = downloads / (stable_name + ".sha256")
          checksum_path.write_text(f"{digest}  {stable_name}\\n")
          PY
          git -C website config user.name "i-Steam Release Bot"
          git -C website config user.email "release-bot@users.noreply.github.com"
          git -C website add AltSource.json alt/source.json downloads
          if git -C website diff --cached --quiet; then
            echo "AltStore source already up to date."
          else
            git -C website commit -m "Publish iOS ${{ env.RELEASE_CHANNEL }} build ${{ steps.meta.outputs.version }}"
            git -C website push origin HEAD:main
          fi

      - name: Delete legacy releases and tags
        if: matrix.platform == 'iOS'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -uo pipefail
          gh release list --limit 1000 --json tagName --jq '.[].tagName' | while IFS= read -r tag; do
            case "$tag" in
              ios-nightly|tvos-nightly|ios-main|tvos-main) ;;
              *)
                echo "Cleaning legacy release/tag: $tag"
                gh release delete "$tag" --yes --cleanup-tag || echo "Already removed or tag missing: $tag"
                ;;
            esac
          done
