          website = Path("website")
          downloads = website / "downloads"
          downloads.mkdir(parents=True, exist_ok=True)
          channel = os.environ["CHANNEL"]
          build_number = os.environ["BUILD_NUMBER"]
          current_version = os.environ["VERSION"]
          channels = [
              (channel, "ios", Path("build/iSteam-ios.ipa"), current_version),
              (channel, "tvos", Path("build/iSteam-tvOS.ipa"), current_version),
          ]

          manifest_path = website / "AltSource.json"
          manifest = json.loads(manifest_path.read_text())
          for item_channel, platform, ipa_path, version in channels:
              if not ipa_path.is_file():
                  raise SystemExit(f"Missing {platform} IPA for {item_channel}: {ipa_path}")
              data = ipa_path.read_bytes()
              digest = hashlib.sha256(data).hexdigest()
              now = datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")
              nightly = item_channel == "nightly"
              tvos = platform == "tvos"
              if tvos:
                  bundle_id = "com.xthrx.isteam.tvos.nightly" if nightly else "com.xthrx.isteam.tvos"
                  app_name = "i-Steam tvOS Nightly" if nightly else "i-Steam tvOS Main"
                  stable_name = "iSteam-tvOS-nightly.ipa" if nightly else "iSteam-tvOS-main.ipa"
              else:
                  bundle_id = "com.xthrx.isteam.nightly" if nightly else "com.xthrx.isteam"
                  app_name = "i-Steam Nightly" if nightly else "i-Steam Release"
                  stable_name = "iSteam-nightly.ipa" if nightly else "iSteam-release.ipa"
              versioned_name = f"iSteam-{platform}-{item_channel}-{version}.ipa"
              shutil.copy2(ipa_path, downloads / versioned_name)
              shutil.copy2(ipa_path, downloads / stable_name)
              (downloads / (stable_name + ".sha256")).write_text(f"{digest}  {stable_name}\\n")
              platform_label = "tvOS / Apple TV" if tvos else "iOS"
              entry = {
                  "version": version,
                  "buildVersion": str(build_number),
                  "date": now,
                  "size": len(data),
                  "sha256": digest,
                  "downloadURL": f"https://i-steam.github.io/downloads/{versioned_name}",
                  "localizedDescription": f"{item_channel.upper()} {platform_label} build {version}. SHA-256: {digest}. Unsigned prototype; use a compatible signing method before installing.",
                  "minOSVersion": "16.0"
              }
              found = False
              for app in manifest.get("apps", []):
                  if app.get("name") == app_name:
                      app["bundleIdentifier"] = bundle_id
                      versions = app.setdefault("versions", [])
                      versions = [v for v in versions if not (v.get("version") == version and str(v.get("buildVersion", "")) == str(build_number))]
                      app["versions"] = ([entry] + versions)[:10]
                      found = True
              if not found:
                  raise SystemExit(f"Could not find AltStore app entry: {app_name}")

          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n")
          alt_path = website / "alt" / "source.json"
          if alt_path.exists():
              alt = json.loads(alt_path.read_text())
              stable_apps = {
