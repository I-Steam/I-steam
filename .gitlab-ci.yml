spec:
  inputs:
    channel:
      description: "Choose the release channel. iOS, tvOS and visionOS will be built."
      type: string
      options: [Nightly, Main]
      default: Nightly
---
stages: [validate, sync, dispatch]

validate_build_configuration:
  stage: validate
  image: python:3.12-alpine
  before_script:
    - pip install --no-cache-dir pyyaml
  script:
    - |
      python3 - <<'PY'
      import pathlib, sys, yaml

      class UniqueKeyLoader(yaml.SafeLoader):
          def construct_mapping(self, node, deep=False):
              self.flatten_mapping(node)
              mapping = {}
              for key_node, value_node in node.value:
                  key = self.construct_object(key_node, deep=deep)
                  if key in mapping:
                      raise yaml.constructor.ConstructorError(
                          "while constructing a mapping",
                          node.start_mark,
                          f"duplicate key {key!r}",
                          key_node.start_mark,
                      )
                  mapping[key] = self.construct_object(value_node, deep=deep)
              return mapping

      for name in ('.gitlab-ci.yml', '.github/workflows/blank.yml', '.github/workflows/release.yml', '.github/workflows/build-qemu-runtime.yml', 'project.yml'):
          text = pathlib.Path(name).read_text()
          try:
              if name == '.gitlab-ci.yml':
                  list(yaml.load_all(text, Loader=UniqueKeyLoader))
              else:
                  yaml.load(text, Loader=UniqueKeyLoader)
          except yaml.YAMLError as error:
              print(f'{name} YAML parse failed: {error}', file=sys.stderr)
              raise SystemExit(1)

      workflow = pathlib.Path('.github/workflows/release.yml').read_text()
      qemu_workflow = pathlib.Path('.github/workflows/build-qemu-runtime.yml').read_text()
      required = [
          'platform: [iOS, tvOS, visionOS]',
          'name: iSteam-${{ matrix.platform }}-${{ matrix.channel }}',
          'name: iSteam-visionOS-${{ matrix.channel }}',
          'PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}',
          'if-no-files-found: error',
          'build/iSteam-visionOS.ipa',
      ]
      missing = [item for item in required if item not in workflow]
      if missing:
          print('Missing release workflow requirements:', ', '.join(missing), file=sys.stderr)
          raise SystemExit(1)
      if 'if-no-files-found: ignore' in workflow:
          raise SystemExit('Release artifacts must not silently ignore missing files.')
      if 'qemu-runtime:' not in workflow or 'uses: ./.github/workflows/build-qemu-runtime.yml' not in workflow:
          raise SystemExit('Release must call the QEMU runtime as a job in the same workflow run.')
      if 'needs: qemu-runtime' not in workflow or 'uses: actions/download-artifact@v4' not in workflow:
          raise SystemExit('App builds must wait for and download the same-run QEMU artifact.')
      if 'workflow_call:' not in qemu_workflow:
          raise SystemExit('QEMU runtime workflow must support reusable-workflow calls.')
      if '.github/workflows/release.yml' not in workflow:
          raise SystemExit('Release workflow must not trigger itself on workflow-only changes.')
      if "utm-ios-arm64-deps-v5-" not in qemu_workflow:
          raise SystemExit('QEMU dependency cache key must be bumped when build-workflow patch logic changes.')
      if "config_host_data.set('CONFIG_POSIX_MEMALIGN', true)" not in qemu_workflow:
          raise SystemExit('QEMU runtime workflow must patch QEMU POSIX_MEMALIGN detection after the failed cross-file probe.')
      if "add_project_link_arguments('-Wl,-force_load,' + ios_compiler_rt, language: 'c')" not in qemu_workflow:
          raise SystemExit('QEMU Meson targets must explicitly link the iOS compiler-rt archive.')
      if '--extra-ldflags=-Wl,-force_load,$IOS_COMPILER_RT' in qemu_workflow:
          raise SystemExit('Do not rely on LDFLAGS/force_load for QEMU Meson targets; use explicit project link arguments.')
      if ".github/workflows/build-qemu-runtime.yml" not in qemu_workflow:
          raise SystemExit('QEMU dependency cache key must include the runtime workflow.')
      if "steps.utm-source.outputs.commit" not in qemu_workflow:
          raise SystemExit('QEMU dependency cache key must include the checked-out upstream UTM commit.')
      if "group: qemu-runtime-ios-arm64-${{ github.ref }}" not in qemu_workflow:
          raise SystemExit('QEMU runtime concurrency must be isolated by Git ref.')
      if 'workflow_dispatch:' not in qemu_workflow or 'workflow_call:' not in qemu_workflow:
          raise SystemExit('QEMU runtime workflow must remain manually runnable and reusable by the release workflow.')
      sync_job = pathlib.Path('.gitlab-ci.yml').read_text()
      if "if: '$CI_COMMIT_BRANCH == \"main\"'" not in sync_job:
          raise SystemExit('GitHub sync must run only for the canonical main branch.')
      if 'git push github HEAD:refs/heads/main' not in sync_job:
          raise SystemExit('GitHub sync must push directly to main.')
      if 'git push github "HEAD:refs/heads/' + '${CI_COMMIT_BRANCH}"' in sync_job:
          raise SystemExit('GitHub sync must not publish feature branches or create mirror PRs.')
      reverse_sync = pathlib.Path('.github/workflows/blank.yml').read_text()
      if '  push:' in reverse_sync:
          raise SystemExit('Automatic GitHub-to-GitLab sync must stay disabled.')
      print('CI YAML (duplicate-key strict), release requirements, QEMU cache invalidation, main-only sync, and source guards passed.')
      PY
    - python3 scripts/validate-qemu-source.py

sync_to_github:
  stage: sync
  # GitLab is canonical. Mirror main only; feature branches stay in GitLab and do not create GitHub PRs.
  resource_group: github-sync-main
  image: alpine:latest
  interruptible: false
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - apk add --no-cache git
  script:
    - |
      set -eu
      if [ -z "${GITHUB_SYNC_TOKEN:-}" ]; then
        echo "GITHUB_SYNC_TOKEN is missing or unavailable to this branch. Add a valid masked GitLab CI/CD variable with GitHub Contents: Read and write permission."
        exit 1
      fi
      git config user.name "i-Steam Sync"
      git config user.email "sync@i-steam.local"
      git remote add github "https://x-access-token:${GITHUB_SYNC_TOKEN}@github.com/I-Steam/I-steam.git"
      if ! git ls-remote github HEAD >/dev/null 2>&1; then
        echo "GitHub authentication failed. Check GITHUB_SYNC_TOKEN and its Contents: Read and write permission."
        exit 1
      fi
      # Push only canonical main directly. Never publish GitLab feature branches to GitHub.
      test "${CI_COMMIT_BRANCH}" = "main"
      git push github HEAD:refs/heads/main
      echo "Synced GitLab main directly to GitHub main (no pull request)."

dispatch_manual_build:
  stage: dispatch
  image: curlimages/curl:8.12.1
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
  script:
    - |
      set -eu
      test -n "${GITHUB_SYNC_TOKEN:-}" || { echo "GITHUB_SYNC_TOKEN is required."; exit 1; }
      CHANNEL="$[[ inputs.channel ]]"
      case "$CHANNEL" in
        Nightly|Main) ;;
        *) echo "Invalid release channel: $CHANNEL"; exit 1 ;;
      esac
      curl --fail-with-body --silent --show-error -X POST \
        -H "Accept: application/vnd.github+json" \
        -H "Authorization: Bearer ${GITHUB_SYNC_TOKEN}" \
        -H "X-GitHub-Api-Version: 2022-11-28" \
        "https://api.github.com/repos/I-Steam/I-steam/actions/workflows/release.yml/dispatches" \
        -d "{\"ref\":\"main\",\"inputs\":{\"channel\":\"$CHANNEL\"}}"
      echo "Dispatched combined iOS + tvOS + visionOS $CHANNEL release."
