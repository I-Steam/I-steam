spec:
  inputs:
    channel:
      description: "Choose the release channel. Both iOS and tvOS will be built."
      type: string
      options: [Nightly, Main]
      default: Nightly
---
stages: [sync, dispatch]

sync_to_github:
  stage: sync
  resource_group: github-main-sync
  image: alpine:latest
  interruptible: false
  before_script:
    - apk add --no-cache git
  script:
    - git config user.name "i-Steam Sync"
    - git config user.email "sync@i-steam.local"
    - git remote set-url origin "https://oauth2:${GITHUB_SYNC_TOKEN}@github.com/I-Steam/I-steam.git"
    - git push --force origin HEAD:refs/heads/main

dispatch_manual_build:
  stage: dispatch
  image: curlimages/curl:8.12.1
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
  script:
    - |
      set -eu
      test -n "${GITHUB_SYNC_TOKEN:-}" || { echo "GITHUB_SYNC_TOKEN is required."; exit 1; }
      CHANNEL="$[[ inputs.channel ]]"
      case "$CHANNEL" in
        Nightly|Main) ;;
        *) echo "Invalid release channel: $CHANNEL"; exit 1 ;;
      esac
      curl --fail-with-body --silent --show-error -X POST \
        -H "Accept: application/vnd.github+json" \
        -H "Authorization: Bearer ${GITHUB_SYNC_TOKEN}" \
        -H "X-GitHub-Api-Version: 2022-11-28" \
        "https://api.github.com/repos/I-Steam/I-steam/actions/workflows/release.yml/dispatches" \
        -d "{\"ref\":\"main\",\"inputs\":{\"channel\":\"$CHANNEL\"}}"
      echo "Dispatched combined iOS + tvOS $CHANNEL release."
