spec:
  inputs:
    release_channel:
      description: "Choose the app channel for a manually started build"
      type: string
      options:
        - nightly
        - main
      default: nightly
---
stages:
  - sync
  - dispatch

sync_to_github:
  stage: sync
  image: alpine:latest
  before_script:
    - apk add --no-cache git
  script:
    - git config user.name "i-Steam Sync"
    - git config user.email "sync@i-steam.local"
    - git remote set-url origin "https://oauth2:${GITHUB_SYNC_TOKEN}@github.com/I-steam/I-steam.git"
    - git push --force origin HEAD:main

# A manually started GitLab pipeline shows a release_channel dropdown and asks
# GitHub Actions to build exactly that channel. Push/scheduled builds remain nightly.
dispatch_manual_build:
  stage: dispatch
  image: curlimages/curl:8.12.1
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
  script:
    - |
      set -eu
      test -n "${GITHUB_SYNC_TOKEN:-}" || { echo "GITHUB_SYNC_TOKEN is required and must allow Actions workflow dispatch."; exit 1; }
      curl --fail-with-body --silent --show-error \
        -X POST \
        -H "Accept: application/vnd.github+json" \
        -H "Authorization: Bearer ${GITHUB_SYNC_TOKEN}" \
        -H "X-GitHub-Api-Version: 2022-11-28" \
        https://api.github.com/repos/I-Steam/I-steam/actions/workflows/build.yml/dispatches \
        -d '{"ref":"main","inputs":{"release_channel":"$[[ inputs.release_channel ]]"} }'
      echo "Requested `$[[ inputs.release_channel ]]` build in GitHub Actions."
