stages:
  - sync

sync_to_github:
  stage: sync
  image: alpine:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - apk add --no-cache git
  script:
    - git config --global user.name "i-Steam Sync"
    - git config --global user.email "sync@i-steam.local"
    - git clone "https://oauth2:${GITHUB_SYNC_TOKEN}@github.com/chantinlongxthrx/I-steam.git" github-repo
    - cd github-repo
    - git remote set-url origin "https://oauth2:${GITHUB_SYNC_TOKEN}@github.com/chantinlongxthrx/I-steam.git"
    - git fetch origin main
    - git checkout main
    - git fetch --depth=1 https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git main
    - git archive --format=tar origin/main 2>/dev/null | tar -xf - || true
    - git add -A
    - git diff --cached --quiet && echo "GitHub already matches." && exit 0
    - git commit -m "Sync from GitLab [skip ci]"
    - git push origin main
