spec:
  inputs:
    channel:
      description: "Choose the release channel. iOS, tvOS and visionOS will be built."
      type: string
      options: [Nightly, Main]
      default: Nightly
---
stages: [validate, sync, dispatch]

validate_build_configuration:
  stage: validate
  image: python:3.12-alpine
  before_script:
    - pip install --no-cache-dir pyyaml
  script:
    - |
      python3 - <<'PY'
      import pathlib, sys, yaml
      workflow = pathlib.Path('.github/workflows/release.yml').read_text()
      project = pathlib.Path('project.yml').read_text()
      for name, text in [('release workflow', workflow), ('XcodeGen project', project)]:
          try:
              yaml.safe_load(text)
          except yaml.YAMLError as error:
              print(f'{name} YAML parse failed: {error}', file=sys.stderr)
              raise SystemExit(1)
      required = [
          'platform: [iOS, tvOS, visionOS]',
          'name: iSteam-${{ matrix.platform }}-${{ matrix.channel }}',
          'name: iSteam-visionOS-${{ matrix.channel }}',
          'PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}',
          'if-no-files-found: error',
          'build/iSteam-visionOS.ipa',
      ]
      missing = [item for item in required if item not in workflow]
      if missing:
          print('Missing release workflow requirements:', ', '.join(missing), file=sys.stderr)
          raise SystemExit(1)
      if 'if-no-files-found: ignore' in workflow:
          raise SystemExit('Release artifacts must not silently ignore missing files.')
      print('Release workflow and XcodeGen YAML parse; platform/artifact/token checks passed.')
      PY
    - python3 scripts/validate-qemu-source.py

sync_to_github:
  stage: sync
  # Serialize pushes to the same GitHub branch, but allow independent branches to sync.
  resource_group: github-sync-$CI_COMMIT_BRANCH
  image: alpine:latest
  interruptible: false
  rules:
    - if: '$CI_COMMIT_BRANCH'
  before_script:
    - apk add --no-cache git
  script:
    - |
      set -eu
      if [ -z "${GITHUB_SYNC_TOKEN:-}" ]; then
        echo "GITHUB_SYNC_TOKEN is missing or unavailable to this branch. Add a valid masked GitLab CI/CD variable with GitHub Contents: Read and write permission."
        exit 1
      fi
      git config user.name "i-Steam Sync"
      git config user.email "sync@i-steam.local"
      git remote add github "https://x-access-token:${GITHUB_SYNC_TOKEN}@github.com/I-Steam/I-steam.git"
      # Check authentication without printing credentials. HEAD exists even when the target branch does not.
      if ! git ls-remote github HEAD >/dev/null 2>&1; then
        echo "GitHub authentication failed. Check GITHUB_SYNC_TOKEN and its Contents: Read and write permission."
        exit 1
      fi
      # Mirror each GitLab branch to the same-named GitHub branch. Feature branches cannot overwrite GitHub main.
      git push github "HEAD:refs/heads/${CI_COMMIT_BRANCH}"
      echo "Synced GitLab branch ${CI_COMMIT_BRANCH} to the same-named GitHub branch."
  before_script:
    - apk add --no-cache git
  script:
    - git config user.name "i-Steam Sync"
    - git config user.email "sync@i-steam.local"
    - git remote set-url origin "https://oauth2:${GITHUB_SYNC_TOKEN}@github.com/I-Steam/I-steam.git"
    - git push --force origin HEAD:refs/heads/main

dispatch_manual_build:
  stage: dispatch
  image: curlimages/curl:8.12.1
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
  script:
    - |
      set -eu
      test -n "${GITHUB_SYNC_TOKEN:-}" || { echo "GITHUB_SYNC_TOKEN is required."; exit 1; }
      CHANNEL="$[[ inputs.channel ]]"
      case "$CHANNEL" in
        Nightly|Main) ;;
        *) echo "Invalid release channel: $CHANNEL"; exit 1 ;;
      esac
      curl --fail-with-body --silent --show-error -X POST \
        -H "Accept: application/vnd.github+json" \
        -H "Authorization: Bearer ${GITHUB_SYNC_TOKEN}" \
        -H "X-GitHub-Api-Version: 2022-11-28" \
        "https://api.github.com/repos/I-Steam/I-steam/actions/workflows/release.yml/dispatches" \
        -d "{\"ref\":\"main\",\"inputs\":{\"channel\":\"$CHANNEL\"}}"
      echo "Dispatched combined iOS + tvOS + visionOS $CHANNEL release."
