spec:
  inputs:
    platform:
      description: "Choose which platform nightly build to dispatch"
      type: string
      options: [iOS, tvOS]
      default: iOS
---
stages: [sync, dispatch]
sync_to_github:
  stage: sync
  image: alpine:latest
  before_script:
    - apk add --no-cache git
  script:
    - git config user.name "i-Steam Sync"
    - git config user.email "sync@i-steam.local"
    - git remote set-url origin "https://oauth2:${GITHUB_SYNC_TOKEN}@github.com/I-Steam/I-steam.git"
    - git push --force origin HEAD:main
dispatch_manual_build:
  stage: dispatch
  image: curlimages/curl:8.12.1
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
  script:
    - |
      set -eu
      test -n "${GITHUB_SYNC_TOKEN:-}" || { echo "GITHUB_SYNC_TOKEN is required."; exit 1; }
      PLATFORM="$[[ inputs.platform ]]"
      if [ "$PLATFORM" = "tvOS" ]; then WORKFLOW="tvos.yml"; else WORKFLOW="ios.yml"; fi
      curl --fail-with-body --silent --show-error -X POST \
        -H "Accept: application/vnd.github+json" \
        -H "Authorization: Bearer ${GITHUB_SYNC_TOKEN}" \
        -H "X-GitHub-Api-Version: 2022-11-28" \
        "https://api.github.com/repos/I-Steam/I-steam/actions/workflows/$WORKFLOW/dispatches" \
        -d '{"ref":"main"}'
      echo "Dispatched $PLATFORM nightly workflow."
