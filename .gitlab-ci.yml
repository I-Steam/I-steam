stages:
  - sync

sync_to_github:
  stage: sync
  image: alpine:latest

  before_script:
    - apk add --no-cache git

  script:
    - git config user.name "i-Steam Sync"
    - git config user.email "sync@i-steam.local"
    - git remote set-url origin "https://oauth2:${GITHUB_SYNC_TOKEN}@github.com/chantinlongxthrx/I-steam.git"
    - git push --force origin HEAD:main
#;)