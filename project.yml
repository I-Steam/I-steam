name: iSteam
options:
  bundleIdPrefix: com.chantinlongx
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  iSteam:
    type: application
    platform: iOS
    sources:
      - path: iSteam
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chantinlongx.iSteam
        INFOPLIST_FILE: iSteam/Info.plist
        LIBRARY_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/box64-build/lib"
        OTHER_LDFLAGS:
          - "-ObjC"
    info:
      path: iSteam/Info.plist
      properties:
        CFBundleDisplayName: iSteam
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
