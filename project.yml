name: iSteam
options:
  bundleIdPrefix: com.Xthrx
  xcodeVersion: "26.0"
  deploymentTarget:
    iOS: "16.0"
    tvOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    ARCHS: "arm64"
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: "arm64e"
targets:
  iSteam:
    type: application
    platform: iOS
    sources:
      - path: iSteam
        excludes:
          - Info.plist
          - Info-tvOS.plist
      - path: src
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.Xthrx.iSteam
        PRODUCT_NAME: iSteam
        INFOPLIST_KEY_CFBundleDisplayName: i-Steam Release
        INFOPLIST_FILE: iSteam/Info.plist
        CODE_SIGN_ENTITLEMENTS: iSteam/iSteam.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: iSteam/iSteam-Bridging-Header.h
        OTHER_LDFLAGS: ["$(inherited)", "-ObjC", "-framework", "Metal", "-framework", "MetalKit"]
  iSteamNightly:
    type: application
    platform: iOS
    sources:
      - path: iSteam
        excludes:
          - Info.plist
          - Info-tvOS.plist
      - path: src
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.Xthrx.iSteam.Nightly
        PRODUCT_NAME: iSteam
        INFOPLIST_KEY_CFBundleDisplayName: i-Steam Nightly
        INFOPLIST_FILE: iSteam/Info.plist
        CODE_SIGN_ENTITLEMENTS: iSteam/iSteam.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: iSteam/iSteam-Bridging-Header.h
        OTHER_LDFLAGS: ["$(inherited)", "-ObjC", "-framework", "Metal", "-framework", "MetalKit"]
  iSteamTV:
    type: application
    platform: tvOS
    sources:
      - path: tvOSApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.Xthrx.iSteam.tvOS
        PRODUCT_NAME: iSteamTV
        INFOPLIST_KEY_CFBundleDisplayName: i-Steam tvOS
        INFOPLIST_FILE: iSteam/Info-tvOS.plist
